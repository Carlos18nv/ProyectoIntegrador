{% extends "base.html" %}
{% block title %}Buscar propiedades | Hogar Ideal{% endblock %}

{% block content %}
<div class="screen-header">
  <a href="{{ url_for('inicio') }}" aria-label="Volver al inicio">‹</a>
  <h1>Buscar propiedades</h1>
</div>

<form class="filter-form" action="{{ url_for('resultados') }}" method="get">
  <h2>Encuentra una propiedad para ti</h2>

  <label>Tipo de propiedad
    <select name="tipo">
      <option value="">Cualquiera</option>
      <option value="casa">Casa</option>
      <option value="departamento">Departamento</option>
      <option value="terreno">Terreno</option>
    </select>
  </label>

  <label>Sector
    <select name="sector">
      <option value="">Cualquiera</option>
      <option value="Quitumbe">Quitumbe</option>
      <option value="Cumbaya">Cumbayá</option>
      <option value="Tumbaco">Tumbaco</option>
      <option value="La Carolina">La Carolina</option>
    </select>
  </label>

  <label>Presupuesto máximo
    <select name="presupuesto_max">
      <option value="">Sin límite</option>
      <option value="180000">$180.000</option>
      <option value="250000">$250.000</option>
      <option value="350000">$350.000</option>
      <option value="500000">$500.000</option>
    </select>
  </label>

  <label>Dormitorios mínimos
    <select name="dormitorios_min">
      <option value="">Cualquiera</option>
      <option value="1">1 o más</option>
      <option value="2">2 o más</option>
      <option value="3">3 o más</option>
      <option value="4">4 o más</option>
    </select>
  </label>

  <div class="pet-toggle">
    <span>Permite mascotas</span>
    <input type="checkbox" name="mascotas">
  </div>

  <button class="wide-action gold-action" type="submit">VER RESULTADOS</button>
</form>
{% endblock %}
