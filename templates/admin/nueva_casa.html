{% extends "admin/base_admin.html" %}
{% block title %}Nueva casa | Panel interno{% endblock %}

{% block content %}
<h1>Publicar una casa</h1>
<p class="page-subtitle">Completa los datos de la nueva propiedad.</p>

<form class="schedule-form" style="background:#fff; border-radius:12px; box-shadow:var(--shadow); max-width:600px;" method="post" action="{{ url_for('nueva_casa') }}">
  <label>Código
    <input type="text" name="codigo" placeholder="Ej: CAS002" required>
  </label>
  <label>Título
    <input type="text" name="titulo" required>
  </label>
  <label>Precio (USD)
    <input type="number" name="precio" min="1" step="0.01" required>
  </label>
  <label>Área (m²)
    <input type="number" name="area_m2" min="1" step="0.01" required>
  </label>
  <label>Dirección
    <input type="text" name="direccion" required>
  </label>
  <label>Sector
    <input type="text" name="sector" placeholder="Ej: Cumbayá">
  </label>
  <label>Dormitorios
    <input type="number" name="dormitorios" min="0">
  </label>
  <label>Baños
    <input type="number" name="banos" min="0">
  </label>
  <label>Número de pisos
    <input type="number" name="num_pisos" min="1">
  </label>
  <label>Descripción
    <textarea name="descripcion" rows="3"></textarea>
  </label>
  <div class="pet-toggle">
    <span>Permite mascotas</span>
    <input type="checkbox" name="permite_mascotas">
  </div>

  <div class="admin-actions">
    <button class="btn-small btn-gold" type="submit">Publicar casa</button>
    <a class="btn-small btn-outline" href="{{ url_for('admin_propiedades') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
