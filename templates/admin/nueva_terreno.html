{% extends "admin/base_admin.html" %}
{% block title %}Nuevo terreno | Panel interno{% endblock %}

{% block content %}
<h1>Publicar un terreno</h1>
<p class="page-subtitle">Completa los datos de la nueva propiedad.</p>

<form class="schedule-form" style="background:#fff; border-radius:12px; box-shadow:var(--shadow); max-width:600px;" method="post" action="{{ url_for('nueva_terreno') }}">
  <label>Código
    <input type="text" name="codigo" placeholder="Ej: TER002" required>
  </label>
  <label>Título
    <input type="text" name="titulo" required>
  </label>
  <label>Precio (USD)
    <input type="number" name="precio" min="1" step="0.01" required>
  </label>
  <label>Área (m²)
    <input type="number" name="area_m2" min="1" step="0.01" required>
  </label>
  <label>Dirección
    <input type="text" name="direccion" required>
  </label>
  <label>Sector
    <input type="text" name="sector" placeholder="Ej: Quitumbe">
  </label>
  <label>Uso de suelo
    <input type="text" name="uso_suelo" placeholder="Ej: residencial, comercial">
  </label>
  <label>Descripción
    <textarea name="descripcion" rows="3"></textarea>
  </label>

  <div class="admin-actions">
    <button class="btn-small btn-gold" type="submit">Publicar terreno</button>
    <a class="btn-small btn-outline" href="{{ url_for('admin_propiedades') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
