{% extends "admin/base_admin.html" %}
{% block title %}Nuevo departamento | Panel interno{% endblock %}

{% block content %}
<h1>Publicar un departamento</h1>
<p class="page-subtitle">Completa los datos de la nueva propiedad.</p>

<form class="schedule-form" style="background:#fff; border-radius:12px; box-shadow:var(--shadow); max-width:600px;"
  method="post" action="{{ url_for('nueva_departamento') }}">
  <label>Código
    <input type="text" name="codigo" placeholder="Ej: DEP002" required>
  </label>
  <label>Título
    <input type="text" name="titulo" required>
  </label>
  <label>Precio (USD)
    <input type="number" name="precio" min="1" step="0.01" required>
  </label>
  <label>Área (m²)
    <input type="number" name="area_m2" min="1" step="0.01" required>
  </label>
  <label>Dirección
    <input type="text" name="direccion" required>
  </label>
  <label>Sector
    <input type="text" name="sector" placeholder="Ej: La Carolina">
  </label>
  <label>Dormitorios
    <input type="number" name="dormitorios" min="0">
  </label>
  <label>Baños
    <input type="number" name="banos" min="0">
  </label>
  <label>URL de la imagen<input type="text" name="imagen_url" placeholder="/static/imagenes/property-1.png"></label>
  <label>Descripción
    <textarea name="descripcion" rows="3"></textarea>
  </label>
  <div class="pet-toggle">
    <span>Tiene ascensor</span>
    <input type="checkbox" name="tiene_ascensor">
  </div>
  <div class="pet-toggle">
    <span>Permite mascotas</span>
    <input type="checkbox" name="permite_mascotas">
  </div>

  <div class="admin-actions">
    <button class="btn-small btn-gold" type="submit">Publicar departamento</button>
    <a class="btn-small btn-outline" href="{{ url_for('admin_propiedades') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
